<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ deck.name }} — Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="flashcard-page wrap">
      <a class="board-back" href="{{ url_for('flashcards') }}">← All decks</a>
      <header class="learning-board-header">
        <span class="sec-num">{{ cards|length }} CARDS</span>
        <h2>{{ flashcard_deck_name(deck) }}</h2>
      </header>
      {% if cards %}
      <section class="study-area">
        <div class="study-filter" role="group" aria-label="문제 보기">
          <button
            class="btn btn-ghost is-active"
            data-filter="all"
            type="button"
          >
            전체 문제</button
          ><button class="btn btn-ghost" data-filter="unknown" type="button">
            모르는 문제만
          </button>
        </div>
        <button
          id="studyCard"
          class="study-card"
          type="button"
          aria-label="Reveal answer"
        >
          <span id="cardSide">QUESTION</span>
          <div id="cardContent" class="study-card-content">
            {{ cards[0].front|learning_html }}
          </div>
        </button>
        <p id="emptyStudy" class="learning-empty-state" hidden>
          모든 문제가 ‘알고 있음’으로 표시되었습니다.
        </p>
        <div class="study-controls">
          <button class="btn btn-ghost" id="previousCard" type="button">
            ← Previous</button
          ><span id="cardProgress">1 / {{ cards|length }}</span
          ><button class="btn btn-primary" id="nextCard" type="button">
            Next →
          </button>
        </div>
        <div class="study-status">
          <span id="knowledgeStatus">상태: 복습 필요</span
          ><button class="btn btn-ghost" id="knownToggle" type="button">
            ✓ 알고 있어요
          </button>
        </div>
      </section>
      <script id="flashcardData" type="application/json">
        [{% for card in cards %}{{ {'id': card.id, 'front': card.front, 'back': card.back}|tojson }}{% if not loop.last %},{% endif %}{% endfor %}]
      </script>
      <script>
        window.flashcardDeckId = {{ deck.id|tojson }};
      </script>
      <script src="/static/js/flashcards.js"></script>
      {% else %}
      <p class="learning-empty-state">This deck contains no cards.</p>
      {% endif %}
    </main>
  </body>
</html>
