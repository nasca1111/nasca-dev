<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ deck.name }} — Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="flashcard-page wrap">
      <a class="board-back" href="{{ url_for('flashcards') }}">← All decks</a>
      <header class="learning-board-header">
        <span class="sec-num">{{ cards|length }} CARDS</span>
        <h2>{{ flashcard_deck_name(deck) }}</h2>
      </header>
      {% if cards %}
      <section class="study-area">
        <div class="study-filter" role="group" aria-label="문제 목록 보기">
          <button class="btn btn-ghost" data-list-filter="all" type="button">
            전체 문제 목록
          </button>
          <button
            class="btn btn-ghost"
            data-list-filter="unknown"
            type="button"
          >
            모르는 문제 목록
          </button>
        </div>
        <section
          id="cardCatalog"
          class="card-catalog"
          hidden
          aria-live="polite"
        >
          <div class="card-catalog-head">
            <div>
              <span id="catalogLabel">전체 문제</span
              ><strong id="catalogCount"></strong>
            </div>
            <button
              id="closeCatalog"
              class="modal-close"
              type="button"
              aria-label="문제 목록 닫기"
            >
              Close
            </button>
          </div>
          <p class="card-catalog-help">
            원하는 문제를 선택하면 그 문제부터 다시 학습합니다.
          </p>
          <div id="cardPicker" class="post-item"></div>
        </section>
        <button
          id="studyCard"
          class="study-card"
          type="button"
          aria-label="Reveal answer"
        >
          <section class="study-card">
            <div class="study-card-panel study-question-panel">
              <span>QUESTION / 문제</span>
              <div id="cardContent" class="study-card-content">
                {{ cards[0].front|learning_html }}
              </div>
            </div>
          </section>
          <section class="study-card-answer">
            <div
              id="answerPanel"
              class="study-card-panel study-answer-panel"
              hidden
            >
              <span>ANSWER / 답변</span>
              <div id="answerContent" class="study-card-content"></div>
            </div>
          </section>
          <small id="cardHint">카드를 눌러 답변 보기</small>
        </button>
        <div class="study-controls">
          <button class="btn btn-danger" id="unknownCard" type="button">
            Review</button
          ><span id="cardProgress">1 / {{ cards|length }}</span
          ><button class="btn btn-primary" id="knownCard" type="button">
            Pass
          </button>
        </div>
        <div class="study-status">
          <span id="knowledgeStatus">상태: 아직 답하지 않음</span>
          <span>판정하면 다음 문제로 이동합니다.</span>
        </div>
      </section>
      <script id="flashcardData" type="application/json">
        [{% for card in cards %}{{ {'id': card.id, 'front': card.front, 'back': card.back}|tojson }}{% if not loop.last %},{% endif %}{% endfor %}]
      </script>
      <script>
        window.flashcardDeckId = {{ deck.id|tojson }};
      </script>
      <script src="/static/js/flashcards.js"></script>
      {% else %}
      <p class="learning-empty-state">This deck contains no cards.</p>
      {% endif %}
    </main>
  </body>
</html>
