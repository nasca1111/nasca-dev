<!doctype html>
<html>
  <head>
    <title>Edit Post</title>
  </head>

  <body>
    <h1>Edit Post</h1>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="text" name="title" value="{{ post.title }}" />

      <br />

      <textarea name="content">{{ post.content }}</textarea>

      <br />

      <button type="submit">Update</button>
    </form>
  </body>
</html>
